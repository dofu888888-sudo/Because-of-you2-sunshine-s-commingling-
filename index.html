<style>
*{box-sizing:border-box}
html,body{margin:0;background:#efe2ce;color:#4b3829;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit}
.screen{display:none}
.screen.active{display:block}
#title{background:#ead7bd;height:100dvh;min-height:100svh;overflow:hidden}
.poster-wrap{position:relative;width:100%;height:100%;max-width:768px;margin:0 auto;line-height:0;overflow:hidden}
.poster{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.hotspot{position:absolute;left:22.3%;width:55.4%;height:5.55%;border:0;background:transparent;border-radius:18px;cursor:pointer;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:-4px}
#startBtn{top:73.45%}
#continueBtn{top:80.38%}
#moreBtn{top:87.32%}
.music-label{position:absolute;left:50%;top:94.0%;transform:translate(-50%,-50%);line-height:1;white-space:nowrap;color:rgba(255,248,239,.95);font-size:clamp(10px,2.6vw,14px);text-shadow:0 1px 4px rgba(54,36,24,.7);pointer-events:none}

#story{
  min-height:100dvh;
  color:#5b4636;
  padding:max(14px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 86% 7%,rgba(255,214,123,.42),transparent 24%),
    radial-gradient(circle at 10% 32%,rgba(255,238,198,.62),transparent 28%),
    linear-gradient(180deg,#fff5df 0%,#f9e5c7 47%,#fff8ea 100%);
}
.story-shell{
  width:min(900px,calc(100% - 28px));margin:0 auto;min-height:calc(100dvh - 28px);
  display:flex;flex-direction:column;position:relative;
}
.story-meta{
  display:flex;justify-content:space-between;gap:14px;padding:12px 12px 13px;
  color:#9a7557;font-size:12px;letter-spacing:.05em;
  background:rgba(255,252,243,.70);border:1px solid rgba(207,157,104,.20);
  border-radius:18px;box-shadow:0 6px 22px rgba(152,104,58,.06);
}
.vn-panel{
  flex:1;display:flex;flex-direction:column;margin-top:12px;padding:20px 18px 14px;
  background:rgba(255,253,247,.83);border:1px solid rgba(222,171,113,.25);
  border-radius:26px;box-shadow:0 16px 45px rgba(157,108,61,.10);
  backdrop-filter:blur(8px);
}
.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;align-items:center}
#speaker{font-weight:800;color:#c8753e;font-size:18px}
#count{font-size:12px;color:#b19279}
#text{
  font-family:"Noto Serif TC","PingFang TC",serif;font-size:17px;line-height:1.92;
  white-space:pre-line;color:#574235;letter-spacing:.018em;
}
.observe{
  margin:14px 0 2px;padding:12px 14px;border-radius:16px;
  background:#fff4cc;border:1px dashed #e5b866;color:#8b6035;
  font-size:14px;line-height:1.7;
}
.observe::before{content:"☀ 雨婕的觀察　";font-weight:800;color:#d7833f}
.choices{display:grid;gap:10px;margin-top:18px}
.choice{
  border:1px solid #e9bd8d;background:#fff8ea;color:#6b4a34;border-radius:17px;
  padding:13px 15px;text-align:left;line-height:1.55;min-height:48px;
  box-shadow:0 5px 14px rgba(173,116,65,.07)
}
.choice:active{transform:translateY(1px);background:#ffefcf}
.controls{
  display:flex;justify-content:center;gap:18px;margin-top:auto;padding:24px 0 8px;
}
.ctrl{
  border:1px solid #e8b77f;background:#fff6e7;color:#a85f32;padding:11px 26px;
  border-radius:999px;box-shadow:0 6px 16px rgba(170,108,57,.08)
}
.ctrl.primary{background:#ef9b5d;color:#fff;border-color:#ef9b5d;font-weight:700}
.playing{text-align:center;color:#a8896f;font-size:12px;margin:10px auto 0;width:100%}
.game-nav{
  display:flex;justify-content:space-around;gap:4px;padding:10px 5px 4px;margin-top:10px;
  background:rgba(255,251,240,.78);border:1px solid rgba(222,171,113,.24);
  border-radius:20px;box-shadow:0 8px 24px rgba(157,108,61,.07)
}
.nav-btn{
  border:0;background:transparent;color:#9a6f51;font-size:11px;padding:9px 4px;
  white-space:nowrap;border-radius:12px
}
.nav-btn:active{background:#ffe9c5;color:#c66f37}
.modal{
  position:fixed;inset:0;z-index:50;background:rgba(96,68,44,.34);display:none;
  align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)
}
.modal.open{display:flex}
.modal-card{
  width:min(680px,100%);max-height:84dvh;overflow:auto;background:#fffaf0;
  border:1px solid #edc79d;padding:20px;color:#5b4636;border-radius:25px;
  box-shadow:0 24px 70px rgba(112,72,38,.22)
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:13px;
  border-bottom:1px solid #f0d9bb
}
.modal-head h2{font-size:19px;margin:0;color:#bf6d38}
.close-btn{border:0;background:#fff0d8;color:#b56b3d;font-size:20px;width:36px;height:36px;border-radius:50%}
.log-entry{padding:14px 2px;border-bottom:1px solid #f1ddc4;line-height:1.7}
.log-entry b{display:block;color:#c8753e;margin-bottom:4px}
.notebook-intro{padding:12px 2px 16px;color:#9a7557;font-size:13px;line-height:1.65}
.char-card{padding:15px 0;border-bottom:1px solid #f0d9bb}
.char-card h3{margin:0 0 10px;color:#b86636;font-size:19px}
.char-field{
  display:grid;grid-template-columns:72px 1fr;gap:10px;padding:9px 10px;margin:6px 0;
  border-radius:13px;background:#fff3df;font-size:14px;line-height:1.55
}
.char-field .label{color:#a66c43;font-weight:700}
.char-field.locked{background:#f8efe3;color:#b7a594}
.char-field.locked .label{color:#ad9987}
.unlock-note{font-size:11px;color:#b79475;margin-top:4px}
.save-status{text-align:center;padding:24px 8px;line-height:1.8}
.chapter-tag{
  display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:999px;
  background:#ffe7b8;color:#a96234;font-size:11px;font-weight:700;letter-spacing:.08em
}
.end{text-align:center;padding:16px 8px}
.end h2{font-family:"Noto Serif TC","PingFang TC",serif;color:#bd6b38}
.end p{line-height:1.8}
@media(max-width:520px){
  #title .poster{width:auto;height:100%;min-width:100%;max-width:none;position:absolute;left:50%;transform:translateX(-50%)}
  #title .poster-wrap{max-width:none}
  .story-shell{width:calc(100% - 24px)}
  .story-meta{font-size:10.5px;padding:10px 11px}
  .vn-panel{padding:17px 15px 12px;border-radius:23px}
  #text{font-size:16px;line-height:1.9}
  .controls{padding-top:20px}
  .game-nav{gap:0}
  .nav-btn{font-size:10.5px;padding-inline:3px}
  .char-field{grid-template-columns:62px 1fr}
}

.obs-entry{padding:15px 2px;border-bottom:1px solid #f0d9bb}
.obs-date{font-size:11px;color:#b18a68;margin-bottom:6px}
.obs-note{background:#fff2c9;border:1px dashed #e0ae62;border-radius:15px;padding:12px 13px;color:#815a35;line-height:1.7}
.log-pager{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 0 2px}
.log-pager button{border:1px solid #e7bd8e;background:#fff4df;color:#a7673d;border-radius:999px;padding:7px 14px}
.log-pager button:disabled{opacity:.35}.log-page-label{font-size:12px;color:#a9876d}
@media(max-width:520px){.game-nav{display:grid;grid-template-columns:repeat(3,1fr);row-gap:2px}.nav-btn{font-size:10.5px;padding:8px 2px}}
</style>
</head>

<script>
(()=>{
const scenes=[{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"島南 → 島北・列車內","s":"旁白","t":"九月午後的陽光斜斜穿過車窗，落在座椅扶手、皮箱扣環和乘客攤開的報紙上。列車每經過一根電線桿，光影便在雨婕膝上飛快閃一下。\n\n窗外還是島南熟悉的稻田。風從田埂另一頭推過來，把整片稻穗壓成一層一層的波浪。"},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"島南 → 島北・列車內","s":"李雨婕","t":"「那個伯伯的帽子快飛走了。」\n\n她盯著田埂上一名騎機車的農夫。\n\n三秒後，草帽真的飛了。\n\n「飛了！」\n\n雨婕一時忘記自己在車廂裡，旁邊看報紙的大叔默默把報紙往下移了一點。","obs":"島南的風很大。以及——不要在安靜的車廂裡替陌生人的帽子加油。"},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"島南 → 島北・列車內","s":"旁白","t":"越往北，田野開始縮小。曬著棉被的平房變成四、五層樓的公寓，水圳旁多了工廠，遠處的高架道路像灰色的長橋橫過天際。\n\n雨婕把臉貼得離玻璃很近，鼻尖幾乎碰上去。"},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"島南 → 島北・列車內","s":"李雨婕","t":"「……真的越來越多房子了。」","c":["把筆記本拿出來記一筆","繼續盯著窗外，看看還會出現什麼","先摸摸口袋裡打公共電話用的零錢"]},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"島北中央車站","s":"旁白","t":"下午三點十七分，列車滑進島北中央車站。\n\n月台上的腳步聲、廣播聲、行李輪子碰過磁磚縫隙的喀啦聲混在一起。雨婕拖著兩大袋行李跟著指標走，五分鐘後——又看見同一家便當店。"},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"島北中央車站","s":"李雨婕","t":"「奇怪……剛才是不是也有這家？」\n\n她站在原地思考。\n\n便當店阿姨也看著她。\n\n兩個人第二次對上眼。","obs":"島北中央車站觀察之一：便當店不會瞬間移動。會移動錯方向的是我。"},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"青年旅舍","s":"旁白","t":"傍晚，她終於找到雜誌上抄下來的青年旅舍。四張床、一台轉頭時會發出「喀」一聲的老電風扇，窗戶正對隔壁大樓的灰牆。\n\n至少今晚不用睡車站。"},{"ch":"序章","title":"北上的列車","date":"1996年9月","place":"青年旅舍","s":"李雨婕","t":"她在筆記本的「住」旁邊畫了一個圈。下面還有兩個字——「工作」。\n\n雨婕盯了三秒，啪地把筆記本闔起來。\n\n「明天再煩惱！」"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第2天","place":"島北市・租屋途中","s":"旁白","t":"隔天早上，島北的天空亮得很快。雨婕拿著租屋雜誌、手寫地址和一張被折得軟趴趴的市區地圖出門。\n\n她原本以為找房子就是「看幾間，挑一間」。兩個小時後，她發現事情顯然不是這樣。"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第2天","place":"巷口","s":"李雨婕","t":"「這隻貓昨天是不是也在這裡？」\n\n虎斑貓趴在一台紅色機車坐墊上，尾巴垂在方向燈旁邊。\n\n雨婕蹲下來看了快兩分鐘。\n\n然後公車從她背後開走了。","obs":"虎斑貓喜歡紅色機車。公車不會等正在研究虎斑貓的人。"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第3天","place":"出租套房","s":"房東","t":"「這間採光很好喔。」\n\n雨婕往窗外看。\n\n窗戶距離隔壁牆壁大概一個手臂。\n\n那面牆確實被太陽照得非常亮。"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第3天","place":"出租套房","s":"李雨婕","t":"「……牆滿亮的。」\n\n房東：「對吧！」\n\n雨婕：「……嗯。」"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第4天","place":"島北市住宅區","s":"旁白","t":"第三間太貴，第四間離車站太遠，第五間的浴室門打開會撞到床。\n\n走到下午，鞋底開始發熱。雨婕買了一塊小餅乾，坐在騎樓矮階上休息，碎屑掉下一小角。"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第4天","place":"島北市住宅區","s":"李雨婕","t":"一隻螞蟻很快找到了餅乾屑。接著第二隻、第三隻。\n\n「你們也在搬家喔？」\n\n她托著臉看牠們排成一條細細的線。\n\n五分鐘後才想起來自己也是出來找房子的。","obs":"螞蟻搬家效率：很高。李雨婕搬家效率：今天目前為零。"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第5天","place":"老公寓・小套房","s":"旁白","t":"第五天下午，她走進一間不算新的小套房。木桌邊角有磨痕，窗框掉了一點漆，牆上留著前一位房客掛時鐘的淡淡圓印。\n\n但四點多的陽光正好從兩棟樓之間鑽進來，在地板上鋪出一塊暖黃色。窗外還有一棵樹。"},{"ch":"第一章","title":"一個可以稱作「家」的地方","date":"1996年9月・第5天","place":"老公寓・小套房","s":"李雨婕","t":"風吹過時，樹葉的影子在牆上輕輕晃。\n\n雨婕站在那塊陽光裡很久。\n\n「……就這裡好了。」"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月・搬家後","place":"雨婕的新住處","s":"旁白","t":"搬進去之後，雨婕開始認識一座城市真正的樣子。\n\n早上六點二十分，樓下早餐店拉鐵門；七點左右，巷口開始出現背書包的學生；八點過後，穿襯衫的人像忽然從每一棟樓裡一起冒出來。"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月・星期三","place":"雨婕的新住處","s":"李雨婕","t":"樓上傳來：「我昨天就叫你收了！」\n\n另一個聲音：「我哪知道會下雨！」\n\n雨婕坐在桌邊，默默在筆記本寫字。","obs":"星期三。樓上又吵架。本週主題：誰沒有把衣服收進來。"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月","place":"島北街頭","s":"葉舒雅","t":"「妳走快一點啦。」","unlock":{"葉舒雅":["姓名","個性"]}},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月","place":"島北街頭","s":"李雨婕","t":"「等一下，那隻鳥只有一隻腳。」\n\n舒雅停下來看了一眼。\n\n「牠另一隻縮起來了。」\n\n「喔。」"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月","place":"島北街頭","s":"葉舒雅","t":"兩個人走了五步。\n\n「妳又怎樣？」\n\n雨婕指向前面：「那個小朋友的冰淇淋要掉了。」\n\n啪。\n\n冰淇淋掉了。"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月","place":"島北街頭","s":"李雨婕","t":"「……掉了。」\n\n舒雅瞪她：「妳不要講得像妳預言成功一樣。」"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月","place":"雨婕的新住處","s":"旁白","t":"晚上，雨婕把零錢、鈔票和幾張收據全部攤在桌上。\n\n她數了一遍。\n\n又數一遍。\n\n第三遍時，窗外那棵樹上的蟬都像是在替她催促。"},{"ch":"第二章","title":"島北生活觀察日誌","date":"1996年9月","place":"雨婕的新住處","s":"李雨婕","t":"「舒雅。」\n\n「嗯？」\n\n「我是不是……應該找工作了？」\n\n電話那頭沉默兩秒。\n\n「妳終於發現了喔？」","unlock":{"葉舒雅":["興趣"]}},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬","place":"雨婕的新住處","s":"旁白","t":"從那天開始，早餐桌上多了一份報紙。雨婕拿紅筆把徵人欄圈得像考卷重點。\n\n第一天，滿滿都是圈。\n\n第四天，圈旁邊開始出現叉。"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬","place":"某公司面試室","s":"面試官","t":"「李小姐，請問妳覺得自己最大的優點是什麼？」"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬","place":"某公司面試室","s":"李雨婕","t":"雨婕認真想了很久。\n\n「……我很會找四葉幸運草。」\n\n面試官：「我是說工作方面。」\n\n「喔。」"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬","place":"另一家公司","s":"旁白","t":"另一次面試前，她坐在接待區等候。旁邊魚缸裡，一隻橘色小魚一直追著另一隻魚跑。\n\n輪到她進去時，她腦袋裡還在想：\n\n——剛才那隻魚真的很過分。","obs":"面試觀察：不要在重要場合前坐魚缸旁邊。會分心。"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬・雨夜","place":"雨婕的新住處","s":"旁白","t":"某個晚上下起雨。水珠沿玻璃往下爬，把遠處商店的燈拉成模糊的橘紅色長線。\n\n桌上的求職報紙被畫得亂七八糟。雨婕趴在桌上，難得沒有立刻說「沒關係」。"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬・雨夜","place":"雨婕的新住處","s":"李雨婕","t":"窗外那棵樹上有一隻鳥縮在葉子下面躲雨。\n\n她看了一會兒。\n\n「……你也很辛苦齁。」\n\n說完自己先笑了一點。"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬","place":"北域街","s":"旁白","t":"隔天下午，她走到北域街。騎樓柱子上貼著補習班傳單，文具店門口掛著褪色的塑膠旗，隔壁商店的收音機正在播天氣預報。\n\n一扇玻璃門旁，貼著一張不起眼的白色徵人啟事：\n\n「徵　事務人員」"},{"ch":"第三章","title":"今天也沒有找到工作","date":"1996年9月下旬","place":"北域街・商社門口","s":"李雨婕","t":"她抬頭看了看招牌。\n\n又低頭看徵人啟事。\n\n「……就這家吧。」\n\n然後推門進去。"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月27日・星期五","place":"北域街・商社接待區","s":"旁白","t":"接待區比想像中安靜。牆上的時鐘走得很大聲，桌角玻璃糖罐裡只剩三顆水果糖，而且剛好全是橘色。\n\n雨婕坐得很端正，卻一直想知道其他顏色到底被誰吃掉了。","obs":"面試前的糖罐只剩三顆橘色水果糖。重要程度：不重要。可是很想知道。"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月27日・星期五","place":"商社面試室","s":"陳俊男","t":"「李雨婕？我是陳俊男。別太緊張，先坐。」\n\n他大約三十歲，袖子捲到手肘，原子筆的筆蓋還忘在桌上。","unlock":{"陳俊男":["姓名"]}},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月27日・星期五","place":"商社面試室","s":"陳俊男","t":"「履歷上寫妳剛從島南大學畢業。為什麼想來島北？」"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月27日・星期五","place":"商社面試室","s":"李雨婕","t":"「因為我一直很想住在這裡。」\n\n俊男等了一下。\n\n她補充：「……而且這裡公車很多。」\n\n俊男忍了兩秒，還是笑了。","unlock":{"陳俊男":["個性"]}},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月27日・星期五","place":"商社面試室","s":"陳俊男","t":"「那文書、電話、資料整理，妳有信心嗎？」\n\n雨婕：「我會很努力記。」\n\n俊男低頭看履歷：「這句話聽起來怎麼有點危險……」"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月27日・星期五・傍晚","place":"北域街","s":"旁白","t":"面試沒有立刻給答案。俊男只說兩天內會聯絡。\n\n夕陽落在騎樓招牌上，她經過那張徵人啟事時，又忍不住回頭看了一眼。"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月28日・星期六・上午","place":"雨婕的新住處","s":"旁白","t":"上午十點零七分，電話響了。\n\n雨婕原本正在替窗邊那盆小植物換位置，聽見鈴聲，差點連花盆一起抱去接電話。"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月28日・星期六・上午","place":"雨婕的新住處","s":"陳俊男","t":"「李小姐嗎？公司這邊決定錄取妳。星期一早上八點半報到，可以嗎？」"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月28日・星期六・上午","place":"巷口公共電話","s":"李雨婕","t":"掛掉不到兩分鐘，她已經抓著零錢跑到巷口。\n\n「舒雅！我找到工作了！」\n\n「妳小聲一點，我耳朵還在。」\n\n「星期一上班！」\n\n「很好啊。」\n\n「而且面試我的主管會笑！」\n\n「……這是什麼錄取條件？」","obs":"好消息如果忍著不講，胸口會癢。最快的處理方式：打電話給舒雅。"},{"ch":"第四章","title":"一場面試，和一通電話","date":"1996年9月29日・星期日","place":"雨婕的新住處","s":"旁白","t":"星期日，她把隔天要穿的衣服掛在門邊，證件放進袋子，再確認一次鬧鐘。\n\n十一點躺下。十一點零五分坐起來確認鬧鐘。十一點十二分又確認一次。"},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一","place":"北域街・商社","s":"旁白","t":"雨婕提早二十五分鐘抵達。辦公室裡有影印機熱紙味、剛泡好的咖啡味，窗邊黃金葛有兩片葉子偷偷爬過隔板。\n\n她還沒坐下，就已經看了那盆植物三次。"},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一","place":"北域街・商社","s":"陳俊男","t":"「這份放第三櫃第二層。」\n\n雨婕：「好！」\n\n五分鐘後，俊男在第五櫃找到它。"},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一","place":"北域街・商社","s":"陳俊男","t":"「李雨婕。」\n\n「是！」\n\n「為什麼在這裡？」\n\n她看第三櫃，又看第五櫃。\n\n「……它們長得很像。」"},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一","place":"北域街・商社","s":"陳俊男","t":"俊男閉上眼睛兩秒。\n\n「不懂就問妳旁邊那個。宇軒！」"},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一","place":"北域街・商社","s":"陳宇軒","t":"靠窗的位置有人抬起頭。\n\n「……嗯？」","unlock":{"陳宇軒":["姓名"]}},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一","place":"北域街・商社","s":"李雨婕","t":"「你好，我是李雨婕！」\n\n「陳宇軒。」\n\n然後他低頭繼續整理文件。\n\n雨婕等了三秒。\n\n……真的沒了。"},{"ch":"第五章","title":"第一天上班，先不要出錯","date":"1996年9月30日・星期一・下班前","place":"北域街・商社","s":"旁白","t":"第一天下班前，她已經知道茶水間水壺加熱會發出細小嗡聲，也知道黃金葛最長那根藤有十一片葉子。\n\n至於文件編號規則——她還在努力。","obs":"黃金葛有十一片葉子。工作規則目前記住……大概六成。"},{"ch":"第六章","title":"今天，陳宇軒也沒有笑","date":"1996年10月1日・星期二","place":"北域街・商社","s":"旁白","t":"第二天，她開始分辨辦公室裡不同人的腳步聲。俊男走路快；有人去茶水間總會摸一下門框；宇軒則幾乎沒有多餘的聲音。"},{"ch":"第六章","title":"今天，陳宇軒也沒有笑","date":"1996年10月1日・星期二・午休前","place":"北域街・商社","s":"陳俊男","t":"「你們知道為什麼會計最不喜歡下雨嗎？」\n\n大家安靜兩秒。\n\n俊男自己接：「因為月底已經夠『帳濕』了。」"},{"ch":"第六章","title":"今天，陳宇軒也沒有笑","date":"1996年10月1日・星期二・午休前","place":"北域街・商社","s":"旁白","t":"辦公室沉默一瞬。\n\n接著有人真笑、有人看主管面子笑。\n\n雨婕笑到差點嗆到水。"},{"ch":"第六章","title":"今天，陳宇軒也沒有笑","date":"1996年10月1日・星期二","place":"北域街・商社","s":"李雨婕","t":"笑完，她轉頭。\n\n宇軒正在把訂書機放回原位。\n\n完全沒笑。","obs":"新的觀察題目：陳宇軒到底會不會笑？"},{"ch":"第六章","title":"今天，陳宇軒也沒有笑","date":"1996年10月2日・星期三","place":"北域街・商社","s":"旁白","t":"她趁宇軒去影印，把桌上鉛筆往左挪一點。\n\n他回來，擺正。\n\n她再挪。\n\n他再擺正。"},{"ch":"第六章","title":"今天，陳宇軒也沒有笑","date":"1996年10月2日・星期三","place":"北域街・商社","s":"陳宇軒","t":"第三次，他抬頭。\n\n「……妳在幹嘛？」\n\n「實驗。」\n\n「什麼實驗？」\n\n「不能告訴你。」","unlock":{"陳宇軒":["個性"]}},{"ch":"第七章","title":"午休十二點零五分","date":"1996年10月3日・星期四","place":"北域街・商社","s":"旁白","t":"雨婕發現，宇軒幾乎每天十二點零五分才起身吃午餐。不是十二點整，也不是十二點十分。"},{"ch":"第七章","title":"午休十二點零五分","date":"1996年10月3日・星期四","place":"北域街・商社","s":"李雨婕","t":"十二點零四分，她偷偷看一眼。\n\n十二點零五分，宇軒闔上資料夾起身。\n\n她小聲：「真的耶。」"},{"ch":"第七章","title":"午休十二點零五分","date":"1996年10月3日・星期四","place":"北域街・商社","s":"陳宇軒","t":"「什麼真的？」\n\n「沒事。」"},{"ch":"第七章","title":"午休十二點零五分","date":"1996年10月3日・星期四","place":"商社附近小吃店","s":"旁白","t":"麵店電風扇吹著牆上的塑膠菜單，最下面價目表一直翹起來又掉下去。\n\n雨婕吃到一半，注意力已經完全被它吸走。"},{"ch":"第七章","title":"午休十二點零五分","date":"1996年10月3日・星期四","place":"商社附近小吃店","s":"陳宇軒","t":"「妳的麵要涼了。」\n\n「喔！」"},{"ch":"第七章","title":"午休十二點零五分","date":"1996年10月3日・星期四","place":"商社附近小吃店","s":"李雨婕","t":"——陳宇軒不是不理人。\n\n他只是講話很省。","obs":"宇軒講話像在省電話費。能用六個字講完，絕對不會用七個。"},{"ch":"第八章","title":"一把被忘記的傘","date":"1996年10月4日・星期五・傍晚","place":"北域街・商社","s":"旁白","t":"五點半，天空忽然暗下來。第一滴雨打到窗上時，雨婕還很有自信：還好早上有看天氣。"},{"ch":"第八章","title":"一把被忘記的傘","date":"1996年10月4日・星期五・傍晚","place":"北域街・商社","s":"李雨婕","t":"她打開抽屜。沒有傘。再看椅背。沒有。\n\n想起來了——傘在家門口，很安全。"},{"ch":"第八章","title":"一把被忘記的傘","date":"1996年10月4日・星期五・傍晚","place":"商社門口","s":"陳宇軒","t":"「妳沒帶？」\n\n「有。」\n\n他看她空空的手。\n\n「……有一把，在家。」"},{"ch":"第八章","title":"一把被忘記的傘","date":"1996年10月4日・星期五・傍晚","place":"前往公車站","s":"旁白","t":"最後宇軒把自己的傘往她那邊偏一點。兩人只是一起走到公車站，肩膀之間還隔著很禮貌的距離。"},{"ch":"第八章","title":"一把被忘記的傘","date":"1996年10月4日・星期五・傍晚","place":"公車站","s":"李雨婕","t":"「你的右肩濕了。」\n\n「沒關係。」\n\n「可是左肩沒有。」\n\n「……因為傘在妳那邊。」"},{"ch":"第八章","title":"一把被忘記的傘","date":"1996年10月4日・星期五・傍晚","place":"公車站","s":"旁白","t":"她很認真地把傘推回正中央。\n\n結果兩個人一起被淋了一點。","obs":"兩個人共撐一把傘的難度，比想像中高。"},{"ch":"第九章","title":"星期三的垃圾車與加班","date":"1996年10月9日・星期三","place":"北域街・商社","s":"旁白","t":"第一次加班發生在星期三。過了六點，電話少了，影印機聲反而變得特別清楚。"},{"ch":"第九章","title":"星期三的垃圾車與加班","date":"1996年10月9日・星期三","place":"北域街・商社","s":"李雨婕","t":"她忽然抬頭：「完了。」\n\n俊男：「怎樣？」\n\n「今天星期三。」\n\n「所以？」\n\n「垃圾車。」"},{"ch":"第九章","title":"星期三的垃圾車與加班","date":"1996年10月9日・星期三","place":"北域街・商社","s":"陳俊男","t":"「我第一次看到有人加班最擔心的是垃圾。」"},{"ch":"第九章","title":"星期三的垃圾車與加班","date":"1996年10月9日・星期三","place":"北域街・商社","s":"陳宇軒","t":"「妳那區八點還有一班。」\n\n「你怎麼知道？」\n\n「以前住附近。」"},{"ch":"第九章","title":"星期三的垃圾車與加班","date":"1996年10月9日・星期三・晚上","place":"雨婕住處附近","s":"旁白","t":"八點零三分，熟悉的垃圾車音樂真的從巷口傳來。\n\n她提著垃圾跑下樓時想：原來宇軒以前住過這附近。","obs":"宇軒以前住過我這附近。證據：他知道星期三八點那班垃圾車。"},{"ch":"第十章","title":"週末不是上班日","date":"1996年10月12日・星期六","place":"島北市・商圈","s":"葉舒雅","t":"「今天不准聊工作。」"},{"ch":"第十章","title":"週末不是上班日","date":"1996年10月12日・星期六","place":"島北市・商圈","s":"李雨婕","t":"「我沒有要聊啊。」\n\n走不到一條街。\n\n「可是我們公司有一個人——」\n\n舒雅：「李、雨、婕。」"},{"ch":"第十章","title":"週末不是上班日","date":"1996年10月12日・星期六","place":"唱片行","s":"葉舒雅","t":"「所以那個不會笑的人長得好看嗎？」\n\n「我哪有說他不會笑。」\n\n「妳剛剛已經講第三次了。」"},{"ch":"第十章","title":"週末不是上班日","date":"1996年10月12日・星期六","place":"唱片行","s":"李雨婕","t":"她拿起一盒錄音帶裝忙。\n\n「我是在做同事觀察。」\n\n舒雅：「妳最好是。」"},{"ch":"第十章","title":"週末不是上班日","date":"1996年10月12日・星期六","place":"回家公車上","s":"旁白","t":"公車搖搖晃晃。她靠著窗，看沿路商店一間一間亮燈。\n\n她想，舒雅真的很愛亂講。\n\n然後又想到那把傘。","obs":"今天規定不能聊工作。結果我大概聊了……一點點。舒雅說不是一點點。"},{"ch":"第十一章","title":"辦公室裡的一盆黃金葛","date":"1996年10月14日・星期一","place":"北域街・商社","s":"旁白","t":"星期一早上，窗邊黃金葛有一片葉子垂下來。全辦公室沒有人注意，除了雨婕。"},{"ch":"第十一章","title":"辦公室裡的一盆黃金葛","date":"1996年10月14日・星期一","place":"北域街・商社","s":"李雨婕","t":"她蹲在花盆旁：「是不是太乾了？」"},{"ch":"第十一章","title":"辦公室裡的一盆黃金葛","date":"1996年10月14日・星期一","place":"北域街・商社","s":"陳宇軒","t":"宇軒經過，停一下。\n\n「不是。昨天窗戶開著，風吹太久。」\n\n「你也有看它？」\ function renderLog(){
 const per=10,total=Math.max(1,Math.min(2,Math.ceil(history.length/per)));
 logPage=Math.max(0,Math.min(logPage,total-1));
 const base=Math.max(0,history.length-20),page=history.slice(base+logPage*per,base+(logPage+1)*per);
 q("logList").innerHTML=(page.length?page.map(h=>`<div class="log-entry"><b>${h.s}</b>${h.t.replace(/\n/g,"<br>")}</div>`).join(""):'<div class="save-status">目前還沒有對話紀錄。</div>')+`<div class="log-pager"><button id="logPrev" ${logPage===0?"disabled":""}>上一頁</button><span class="log-page-label">${logPage+1} / ${total}</span><button id="logNext" ${logPage>=total-1?"disabled":""}>下一頁</button></div>`;
 if(q("logPrev"))q("logPrev").onclick=()=>{logPage--;renderLog()}; if(q("logNext"))q("logNext").onclick=()=>{logPage++;renderLog()};
}

function addObservation(x){if(!x||!x.obs)return;if(!observations.some(o=>o.i===i))observations.push({i,date:x.date||"",place:x.place||"",note:x.obs});}
function renderObservations(){q("obsList").innerHTML=observations.length?observations.map(o=>`<div class="obs-entry"><div class="obs-date">${o.date}${o.place?"　・　"+o.place:""}</div><div class="obs-note">${o.note}</div></div>`).join(""):'<div class="save-status">目前還沒有記下新的觀察。</div>';}
function applyMusic(){q("musicBtn").textContent="音樂："+(musicOn?"開":"關");if(!musicOn){tm.pause();bgm.pause();}else if(story.classList.contains("active"))play(bgm);else play(tm);}

function showTitle(){story.classList.remove("active");title.classList.add("active");bgm.pause();if(musicOn)play(tm);}
function enter(reset){title.classList.remove("active");story.classList.add("active");tm.pause();tm.currentTime=0;if(reset){i=0;flags={};history=[];observations=[];unlocks={"李雨婕":["姓名","個性","興趣","夢想","家庭背景"]};}if(musicOn)play(bgm);render();}
function render(){
 const x=scenes[i], choices=q("choices"); choices.innerHTML=""; addHistory(x); addObservation(x); applyUnlocks(x);
 if(x.end){
   q("speaker").textContent="";q("count").textContent="";
   q("text").innerHTML='<div class="end"><span class="chapter-tag">第二十章</span><h2>冬天以前</h2><p>—— 目前版本完 ——</p><p>島北開始變冷了。雨婕也終於確認：陳宇軒真的會笑。</p></div>';
   q("nextBtn").textContent="回到標題";q("nextBtn").disabled=false;save();return;
 }
 document.querySelector(".story-meta").innerHTML=`<span>${x.date||""}</span><span>${x.place||""}</span>`;
 q("speaker").textContent=x.s;
 q("count").textContent=x.ch+"・"+x.title;
 q("text").innerHTML=x.t.replace(/\n/g,"<br>")+(x.obs?`<div class="observe">${x.obs}</div>`:"");
 q("nextBtn").textContent="繼續 ›";
 if(x.c){
   q("nextBtn").disabled=true;
   x.c.forEach((txt,n)=>{
     let b=document.createElement("button");b.className="choice";b.type="button";b.textContent=txt;
     b.addEventListener("click",()=>{flags["c"+i]=n;i++;save();render();});choices.appendChild(b);
   })
 }else q("nextBtn").disabled=false;
 save();
}
q("startBtn").addEventListener("click",()=>enter(true));
q("continueBtn").addEventListener("click",()=>{try{let s=JSON.parse(localStorage.getItem("winterWarmSave"));i=Math.max(0,Math.min(s.i||0,scenes.length-1));flags=s.flags||{};history=s.history||[];observations=s.observations||scenes.slice(0,(s.i||0)+1).map((x,idx)=>x.obs?{i:idx,date:x.date||"",place:x.place||"",note:x.obs}:null).filter(Boolean);musicOn=s.musicOn!==false;unlocks=s.unlocks||{"李雨婕":["姓名","個性","興趣","夢想","家庭背景"]};}catch(e){i=0;flags={};history=[];musicOn=true;}enter(false);applyMusic();});
q("moreBtn").addEventListener("click",()=>window.open("https://linktr.ee/LeoTsai0409","_blank","noopener"));
q("titleBtn").addEventListener("click",showTitle);

q("musicBtn").addEventListener("click",()=>{musicOn=!musicOn;applyMusic();save();});
q("logBtn").addEventListener("click",()=>{renderLog();openModal("logModal");});
q("charsBtn").addEventListener("click",()=>{renderChars();openModal("charsModal");});
q("obsBtn").addEventListener("click",()=>{renderObservations();openModal("obsModal");});
q("saveBtn").addEventListener("click",()=>{save();q("saveStatus").innerHTML="已儲存目前進度。<br><small>"+(scenes[i].ch||"")+"・"+(scenes[i].title||"")+"</small>";openModal("saveModal");});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeModal(m.id);}));

q("nextBtn").addEventListener("click",()=>{if(scenes[i].end)showTitle();else{i=Math.min(i+1,scenes.length-1);render();}});
})();
</script>
</body>
</html>
